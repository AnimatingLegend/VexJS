<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vex.js - Tweening</title>
    <style>
      body {
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      canvas {
        background: #222;
        image-rendering: pixelated;
        border: 2px solid #444;
      }
    </style>
  </head>
  <body>
    <canvas id="vex-canvas" width="640" height="480"></canvas>
    <script type="module">
      import VexGame from "../../source/VexGame.js";
      import PlayState from "./PlayState.js";

      const canvas = document.getElementById("vex-canvas");
      const vexGame = new VexGame({
        width: 640,
        height: 480,
        canvas,
        initialState: new PlayState(),
      });
      vexGame.start();
    </script>
  </body>
</html>
